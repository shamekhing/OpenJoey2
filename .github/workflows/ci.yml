name: CI

# Monorepo CI: headless tests (core/cards/engine) on three OSes, the raylib
# app build on ubuntu, a web (Emscripten) build smoke, and clang-format.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build + test (all suites)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
          ctest --test-dir build --output-on-failure -C Release

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Superbuild (Release, includes raylib UI)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69
      - name: Configure + build (web)
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web -j4

      - name: Verify web artifact
        run: |
          test -f build-web/web/OpenJoey2.js
          test -f build-web/web/OpenJoey2.wasm
          test -f build-web/web/OpenJoey2.data
          test -f web/index.html

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check (shared .clang-format)
        run: |
          find include src tests \
               \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
